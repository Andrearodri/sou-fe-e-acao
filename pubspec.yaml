name: vida_com_cristo
description: MVP Flutter Web de uma plataforma cristã digital com autenticação Supabase.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  supabase_flutter: ^1.10.0
  supabase: ^1.10.0
  provider: ^6.0.0
  http: ^1.1.0
  intl: ^0.19.0
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  url_launcher: ^6.2.0
  share_plus: ^7.2.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  audio_service: ^0.18.11
  just_audio: ^0.9.31
  connectivity_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
